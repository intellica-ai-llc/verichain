[workspace]
resolver = "2"
members = ["crates/vc-core", "crates/vc-log", "crates/vc-cose"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
thiserror = "1"
ed25519-dalek = "2"
base64 = "0.22"
ciborium = "0.2"
